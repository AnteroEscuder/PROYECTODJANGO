{% extends 'estructura/principal.html' %}

{% block contenido %}
<div class="container mt-4">
  <h2>Editar Tienda: {{ tienda_edited.nombre }}</h2>
  <form method="post">
    {% csrf_token %}
    {% load django_bootstrap5 %}
    {% bootstrap_form edit_tienda %}
    <button type="submit" class="btn btn-success">Guardar Cambios</button>
    <a href="{% url 'get_tienda' idTien=tienda_edited.id %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
