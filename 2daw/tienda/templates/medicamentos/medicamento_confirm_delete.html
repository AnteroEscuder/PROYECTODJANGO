{% extends 'estructura/principal.html' %}

{% block contenido %}
<div class="container mt-4">
  <h2>Eliminar Medicamento</h2>
  <p>¿Estás seguro de que deseas eliminar el medicamento <strong>{{ medicamento.nombre }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'get_medicamento' idMed=medicamento.id %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
