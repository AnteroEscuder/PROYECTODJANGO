{% extends 'estructura/principal.html' %}

{% block contenido %}
<div class="container mt-4">
  <h2>¿Eliminar Cuenta Bancaria?</h2>
  <p>¿Estás seguro de que deseas eliminar la cuenta con IBAN <strong>{{ cuenta.iban }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
    <a href="{% url 'ver_cuenta_bancaria' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
