{% extends 'estructura/principal.html' %}

{% block contenido %}
<div class="container mt-4">
  <h2>Editar Datos del Vendedor</h2>
  <form method="post">
    {% csrf_token %}
    {% load django_bootstrap5 %}
    {% bootstrap_form form %}
    <button type="submit" class="btn btn-success">Guardar Cambios</button>
    <a href="{% url 'ver_datos_vendedor' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
